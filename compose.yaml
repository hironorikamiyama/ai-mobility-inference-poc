services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:8
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand({ ping: 1 }).ok"
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build: .
    command: python -m src.worker
    environment:
      REDIS_HOST: redis
      MONGO_URI: mongodb://mongo:27017/
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

  producer:
    build: .
    command: python -m src.producer
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - tools

volumes:
  mongo_data:
  redis_data:
