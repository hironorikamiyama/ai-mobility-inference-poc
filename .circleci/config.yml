
version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.14.8

    resource_class: medium

    steps:
      - checkout

      - run:
          name: Check Python version
          command: |
            python --version

      - restore_cache:
          keys:
            - venv-v2-py3148-torch2141-{{ arch }}-{{ checksum "requirements.txt" }}

      - run:
          name: Prepare Python environment
          command: |
            set -e

            # キャッシュが復元できても、実行できない場合は再構築する
            if [ -f .venv/.dependencies-ready ] && \
               .venv/bin/python -c "import torch, numpy, redis, pymongo, pytest" && \
               .venv/bin/python -m pip --version; then
              echo "Using cached Python environment"
            else
              echo "Creating Python environment"

              rm -rf .venv
              python -m venv .venv

              .venv/bin/python -m pip install \
                torch==2.14.1+cpu \
                --index-url https://download.pytorch.org/whl/cpu

              .venv/bin/python -m pip install \
                -r requirements.txt pytest

              touch .venv/.dependencies-ready
            fi

            .venv/bin/python --version
            .venv/bin/python -m pytest --version

      - save_cache:
          key: venv-v2-py3148-torch2141-{{ arch }}-{{ checksum "requirements.txt" }}
          paths:
            - .venv

      - run:
          name: Check Python syntax
          command: |
            .venv/bin/python -m compileall -q src scripts tests

      - run:
          name: Check Bash syntax
          command: |
            bash -n scripts/run_replica_benchmark.sh
            bash -n scripts/run_benchmark.sh

      - run:
          name: Run pytest
          command: |
            mkdir -p test-results
            .venv/bin/python -m pytest -q tests \
              --ignore=tests/integration \
              --junitxml=test-results/pytest.xml

      - store_test_results:
          path: test-results

      - store_artifacts:
          path: test-results

  docker-build:
    docker:
      - image: cimg/base:stable

    resource_class: medium

    steps:
      - checkout

      - setup_remote_docker

      - run:
          name: Check Docker environment
          command: |
            docker version
            docker info

      - run:
          name: Build inference worker image
          command: |
            docker build \
              --tag ai-mobility-inference-poc:ci \
              .

      - run:
          name: Verify Docker image
          command: |
            docker image inspect \
              ai-mobility-inference-poc:ci \
              --format 'Image ID: {{.Id}}'

            docker image inspect \
              ai-mobility-inference-poc:ci \
              --format 'Image size: {{.Size}} bytes'

      - run:
          name: Smoke test Docker image
          command: |
            docker run --rm \
              --entrypoint python \
              ai-mobility-inference-poc:ci \
              -c "import torch; print('PyTorch:', torch.__version__)"

  k8s-validate:
    docker:
      - image: cimg/base:stable

    resource_class: small

    steps:
      - checkout

      - run:
          name: Install Kubeconform
          command: |
            set -euo pipefail

            KUBECONFORM_VERSION="v0.6.3"

            curl --fail --location --retry 3 \
              "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
              -o /tmp/kubeconform.tar.gz

            mkdir -p /tmp/kubeconform-bin

            tar -xzf /tmp/kubeconform.tar.gz \
              -C /tmp/kubeconform-bin kubeconform

            /tmp/kubeconform-bin/kubeconform -v

      - run:
          name: Validate Kubernetes manifests
          command: |
            set -euo pipefail

            /tmp/kubeconform-bin/kubeconform \
              -strict \
              -summary \
              -kubernetes-version 1.37.0 \
              k8s/

  integration-test:
    docker:
      - image: cimg/python:3.14.8
        environment:
          REDIS_URL: redis://localhost:6379/0
          MONGO_URI: mongodb://localhost:27017/
      - image: redis:7
      - image: mongo:8

    resource_class: medium

    steps:
      - checkout

      - run:
          name: Install integration dependencies
          command: |
            python -m pip install \
              "redis>=6,<7" \
              "pymongo>=4,<5" \
              pytest

      - run:
          name: Wait for Redis and MongoDB
          command: |
            python - <<'PY'
            import time
            from pymongo import MongoClient
            from redis import Redis

            for attempt in range(60):
                try:
                    redis = Redis(host="localhost", port=6379)
                    mongo = MongoClient(
                        "mongodb://localhost:27017/",
                        serverSelectionTimeoutMS=1000,
                    )
                    assert redis.ping()
                    mongo.admin.command("ping")
                    print("Redis and MongoDB are ready")
                    break
                except Exception:
                    if attempt == 59:
                        raise
                    time.sleep(1)
            PY

      - run:
          name: Run integration tests
          command: |
            mkdir -p test-results
            python -m pytest -q tests/integration \
              --junitxml=test-results/integration.xml

      - store_test_results:
          path: test-results

      - store_artifacts:
          path: test-results

workflows:
  ci:
    jobs:
      - test
      - docker-build
      - k8s-validate
      - integration-test
