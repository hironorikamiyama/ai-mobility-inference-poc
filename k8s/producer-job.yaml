apiVersion: batch/v1
kind: Job
metadata:
  name: inference-producer
  namespace: ai-mobility-poc
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: producer
          image: ai-mobility-inference-poc:cpu
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - src.producer
          env:
            - name: REDIS_HOST
              value: redis
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: 500m
